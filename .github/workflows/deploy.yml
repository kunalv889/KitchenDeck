name: Deploy KitchenDeck

# ── Required GitHub Secrets ──────────────────────────────────────────────────
# AZURE_CREDENTIALS                Service principal JSON (az ad sp create-for-rbac --sdk-auth)
# AZURE_RESOURCE_GROUP             Resource group containing the Container App
# AZURE_CONTAINER_APP_NAME         Container App name (e.g. kitchendeck-api)
# BACKEND_URL                      Container App URL INCLUDING /api
#                                    (e.g. https://kitchendeck-api.<region>.azurecontainerapps.io/api)
# AZURE_STATIC_WEB_APPS_API_TOKEN  Deployment token from the Static Web App resource
# ─────────────────────────────────────────────────────────────────────────────
# Backend runtime config (ASPNETCORE_URLS, Jwt__Secret,
# ConnectionStrings__AzureBlobStorage, Cors__AllowedOrigins__0), the ingress
# target port (8080), the container name, and the GHCR pull credential all live
# ON the Container App in Azure. This pipeline ONLY swaps the image, so a new
# deployment can never regress that configuration.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend → Container Apps (via GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/KitchenDeck.API/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kitchendeck-api:latest
            ghcr.io/${{ github.repository_owner }}/kitchendeck-api:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App image (image-only — preserves all other config)
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ghcr.io/${{ github.repository_owner }}/kitchendeck-api:${{ github.sha }}

  deploy-frontend:
    name: Deploy Frontend → Static Web Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/kitchen-deck-ui
          output_location: dist
        env:
          VITE_API_URL: ${{ secrets.BACKEND_URL }}
